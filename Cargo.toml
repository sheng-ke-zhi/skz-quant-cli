[package]
name = "skz-quant-cli"
version = "0.1.7"
edition = "2024"
# 官方只发布预编译产物（PyPI wheel / Release 二进制）；公开源码可供开发和自行构建，
# 但不承诺兼容旧 rustc。压 MSRV 换不到官方分发兼容性，只会反过来钉住依赖
# （历史上 ureq 就为守 1.80 被钉在 ~3.2）。跟着 stable 走。
rust-version = "1.97.1"
description = "面向 AI Agent 的胜可知量化研究与实盘交易命令行工具"
authors = ["胜可知团队"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "skz"
path = "src/bin/skz.rs"

[lib]
name = "skz"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fastrand = "2"
directories = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
httpmock = "0.8"
tempfile = "3"

# 本地日常构建：只求快。去掉 lto、恢复并行 codegen，本地不再替发布买单。
# 发布不要用这个 profile —— 用下面的 dist。
[profile.release]
opt-level = 2
codegen-units = 16

# 发布产物：体积优先。由本地 Python 发布流程用 `cargo build --profile dist` 构建。
# lto + codegen-units=1 + opt=z 是最慢最吃内存的组合，日常开发不使用。
[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
